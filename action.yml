name: 'DevContainer Doctor'
description: 'Validate devcontainer.json and fix Dev Container / Codespaces setup errors.'
author: '6t9xstar'
branding:
  icon: 'box'
  color: 'purple'
inputs:
  path:
    description: "Workspace folder or devcontainer.json file"
    required: false
    default: "."
  fail-on:
    description: "Lowest severity that fails the step: error, warning, info or none"
    required: false
    default: "error"
  args:
    description: "Extra command-line arguments"
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install DevContainer Doctor
      shell: bash
      run: cd "$GITHUB_ACTION_PATH" && npm ci --omit=dev --no-audit --no-fund --loglevel=error
    - name: Run DevContainer Doctor
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        ARGS=(scan "$INPUT_PATH")
        read -r -a EXTRA <<< "$INPUT_ARGS"
        CLI="$GITHUB_ACTION_PATH/bin/devcontainer-doctor.js"
        node "$CLI" "${ARGS[@]}" ${EXTRA[@]+"${EXTRA[@]}"} --format markdown --fail-on none >> "$GITHUB_STEP_SUMMARY" || true
        node "$CLI" "${ARGS[@]}" ${EXTRA[@]+"${EXTRA[@]}"} --format github --fail-on "$INPUT_FAIL_ON"
